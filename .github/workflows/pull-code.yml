name: Pull Code

on:
  push:
    branches: [ main ]
    pull_request:
    workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pull code
        uses: actions/checkout@v4

      - name: Setup check
        run: |
          uname -a
          cat /etc/os-release
          pwd
          ls -la